name: Build APK

# Run it by hand: GitHub -> Actions -> "Build APK" -> Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # Optional: add a repository secret called CURSEFORGE_API_KEY to enable CurseForge.
      # Modrinth works without any key.
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      # 1) The original open-source launcher, pinned to a known commit
      - name: Checkout PojavLauncher (base)
        uses: actions/checkout@v4
        with:
          repository: PojavLauncherTeam/PojavLauncher
          ref: b12ad048157b3aa255d078c235dd4571e1900309
          submodules: "recursive"

      # 2) This repository (holds nexa.patch with all our changes)
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: _mine

      - name: Apply our changes
        run: git apply --verbose _mine/nexa.patch

      # authlib-injector lets the game talk to the Ely.by session server.
      # The app copies it out of its assets when an Ely.by account is used.
      - name: Get authlib-injector (Ely.by support)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          url=$(gh api repos/yushijinhun/authlib-injector/releases/latest \
            --jq '[.assets[] | select(.name | test("^authlib-injector-.*\\.jar$"))][0].browser_download_url')
          echo "Using: $url"
          mkdir -p app_pojavlauncher/src/main/assets/authlib-injector
          curl -L --fail -o app_pojavlauncher/src/main/assets/authlib-injector/authlib-injector.jar "$url"
          unzip -tq app_pojavlauncher/src/main/assets/authlib-injector/authlib-injector.jar

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Get LTW (renderer)
        run: |
          cd app_pojavlauncher/libs
          curl -L --fail -o ltw-release.aar https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      # The JRE builds that Pojav's own CI used are no longer stored (they expire).
      # The official release APK ships the same runtimes, so we take them from there.
      - name: Get Java runtimes (8, 17, 21) from the official Pojav release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "APK files in official releases:"
          gh api repos/PojavLauncherTeam/PojavLauncher/releases \
            --jq '.[].assets[] | select(.name|endswith(".apk")) | "\(.size) \(.name) \(.browser_download_url)"' | head -20
          url=$(gh api repos/PojavLauncherTeam/PojavLauncher/releases \
            --jq '[.[].assets[] | select(.name|endswith(".apk"))] | max_by(.size) | .browser_download_url')
          echo "Using: $url"
          curl -L --fail -o /tmp/pojav-official.apk "$url"
          unzip -l /tmp/pojav-official.apk | grep "assets/components/jre" | head -20 || true
          mkdir -p /tmp/pojav-apk
          unzip -q -o /tmp/pojav-official.apk 'assets/components/jre*' -d /tmp/pojav-apk
          cp -r /tmp/pojav-apk/assets/components/jre* app_pojavlauncher/src/main/assets/components/
          ls -la app_pojavlauncher/src/main/assets/components/

      - name: Keep only the arm64 runtime (smaller APK)
        run: |
          find app_pojavlauncher/src/main/assets/components -type f \
            \( -name 'bin-arm.tar.xz' -o -name 'bin-x86.tar.xz' -o -name 'bin-x86_64.tar.xz' \) -print -delete
          du -sh app_pojavlauncher/src/main/assets/components/*

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build helper JARs
        run: |
          ./scripts/languagelist_updater.sh
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          gradle :app_pojavlauncher:assembleDebug --no-daemon
          mkdir out
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/Nexa-Launcher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Launcher
          path: out/Nexa-Launcher.apk

    
